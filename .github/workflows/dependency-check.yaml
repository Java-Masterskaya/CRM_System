name: Dependency-Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check NVD API key
        if: ${{ env.NVD_API_KEY == '' }}
        run: |
          echo "::error::Секрет NVD_API_KEY не задан — без ключа загрузка базы NVD не укладывается в таймаут"
          exit 1

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD database
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ steps.date.outputs.date }}
          restore-keys: nvd-

      - name: Dependency-Check
        run: ./gradlew dependencyCheckAnalyze

      - name: Save NVD database
        uses: actions/cache/save@v6
        if: ${{ !cancelled() }}
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ steps.date.outputs.date }}

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
          if-no-files-found: ignore
          retention-days: 3
