name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: SpotBugs
        if: ${{ !cancelled() }}
        run: ./gradlew spotbugsMain spotbugsTest || { cat build/reports/spotbugs/*.txt; exit 1; }

      - name: Build & Test
        id: test
        if: ${{ !cancelled() }}
        run: ./gradlew assemble test

      - name: Coverage
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: ./gradlew jacocoTestCoverageVerification

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 3

  dependency-check:
    name: Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check NVD API key
        if: ${{ env.NVD_API_KEY == '' }}
        run: |
          echo "::error::Секрет NVD_API_KEY не задан — без ключа загрузка базы NVD не укладывается в таймаут"
          exit 1

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD database
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ steps.date.outputs.date }}
          restore-keys: nvd-

      - name: Dependency-Check
        run: ./gradlew dependencyCheckAnalyze

      - name: Save NVD database
        uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ steps.date.outputs.date }}

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
          if-no-files-found: ignore
          retention-days: 3
