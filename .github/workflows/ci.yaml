name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crm_user -d crm_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: SpotBugs
        if: ${{ !cancelled() }}
        run: ./gradlew spotbugsMain spotbugsTest || { cat build/reports/spotbugs/*.txt; exit 1; }

      - name: Build & Test
        id: test
        if: ${{ !cancelled() }}
        run: ./gradlew assemble test
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

      - name: Coverage
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: ./gradlew jacocoTestCoverageVerification

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 3
