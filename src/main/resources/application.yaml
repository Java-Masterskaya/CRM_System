spring:
  application:
    name: crm

  main:
    banner-mode: "off"

  profiles:
    default: local

  flyway:
    out-of-order: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  datasource:
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: -1

  # При остановке планировщик ждёт, пока обработчик исходящих событий допишет текущую порцию.
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s

app:
  outbox:
    scheduler-enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-interval: ${OUTBOX_POLL_INTERVAL:5s}
    lease: ${OUTBOX_LEASE:5m}
    retry-delay: ${OUTBOX_RETRY_DELAY:1m}

server:
  port: ${SERVER_PORT:8080}

  servlet:
    context-path: /api/v1

management:
  server:
    port: ${MANAGEMENT_PORT:8081}

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

      cache:
        time-to-live: 1s

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active:default}

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
