spring:
  application:
    name: crm

  profiles:
    default: local

  flyway:
    out-of-order: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

  servlet:
    context-path: /api/v1
