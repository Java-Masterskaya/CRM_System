<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${requestSubject}">Тема заявки</title>
</head>
<body>
<p>Здравствуйте, <span th:text="${recipientName}">имя</span>!</p>
<p>К заявке «<span th:text="${requestSubject}">тема</span>» добавлен комментарий.
    Автор: <span th:text="${commentAuthor}">автор</span>.</p>
<blockquote th:text="${commentText}">Текст комментария</blockquote>
<p>Номер заявки: <span th:text="${requestId}">номер</span></p>
<p>Это письмо отправлено автоматически, отвечать на него не нужно.</p>
</body>
</html>
